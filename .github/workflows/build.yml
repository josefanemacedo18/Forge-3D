name: Forge 3D — testes e pacote

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  motor:
    name: Motor (Python, Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.txt pytest pytest-timeout
      - name: Testes do motor
        working-directory: engine
        run: python -m pytest -q --timeout=300 -rA

  plugin:
    name: Plugin (C#) e pacote
    runs-on: windows-latest
    needs: motor
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambiente do motor (para os testes de integração)
        working-directory: engine
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt
      - name: Testes do núcleo C#
        env:
          FORGE3D_TEST_ENGINE: ${{ github.workspace }}\engine
        run: dotnet test src/Forge3D.Core.Tests/Forge3D.Core.Tests.csproj -c Release
      - name: Pacote de instalação
        shell: pwsh
        run: ./installer/package.ps1 -Saida dist -SemTestes
      - uses: actions/upload-artifact@v4
        with:
          name: Forge3D-Revit2027
          path: dist/Forge3D
          retention-days: 30
