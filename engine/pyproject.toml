[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge3d-engine"
version = "0.1.0"
description = "Motor do Forge 3D: converte modelos 3D e imagens em famílias paramétricas do Revit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.4",
    "shapely>=2.0",
    "networkx>=3.0",
    "manifold3d>=2.4",
    "fast-simplification>=0.1.7",
    "scikit-image>=0.22",
    "pillow>=10.0",
    "pycollada>=0.8",
    "lxml>=4.9",
    "rtree>=1.1",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# Imagem -> 3D com IA (GPU NVIDIA ou CPU). Instalado pelo instalador quando o
# usuário escolhe o módulo de IA; os pesos são baixados uma única vez.
ia = [
    "rembg>=2.0.50",
    "onnxruntime>=1.17",
    "torch>=2.1",
    "transformers>=4.40",
    "einops>=0.7",
    "omegaconf>=2.3",
    "huggingface_hub>=0.23",
]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
forge3d = "forge3d.cli:main"

[tool.setuptools.packages.find]
include = ["forge3d*"]

[tool.setuptools.package-data]
"forge3d.spec" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
